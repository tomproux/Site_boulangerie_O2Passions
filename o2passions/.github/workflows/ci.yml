name: CI/CD O2Passions

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ------------------------------------------------------------
  # Qualité et tests back-end (Python / Flask / PostgreSQL)
  # ------------------------------------------------------------
  backend:
    name: Back-end — lint & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: o2passions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/o2passions_test
      JWT_SECRET: ci-test-secret
      STRIPE_SECRET_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Initialiser le schéma PostgreSQL de test
        working-directory: backend
        run: psql "$DATABASE_URL" -f schema.sql
        env:
          PGPASSWORD: postgres

      - name: Lint (flake8)
        working-directory: backend
        run: flake8 . --max-line-length=110 --exclude=.venv,__pycache__

      - name: Vérification du formatage (black)
        working-directory: backend
        run: black --check --line-length=110 .
        continue-on-error: true

      - name: Tests unitaires et d'intégration (pytest)
        working-directory: backend
        run: pytest -v

  # ------------------------------------------------------------
  # Qualité et tests front-end (JavaScript vanilla)
  # ------------------------------------------------------------
  frontend:
    name: Front-end — lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm install

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Tests unitaires (Jest)
        working-directory: frontend
        run: npm test

  # ------------------------------------------------------------
  # Déploiement staging (branche develop)
  # ------------------------------------------------------------
  deploy-staging:
    name: Déploiement staging
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - name: Déployer sur l'environnement de staging
        run: |
          echo "Déclenchement du déploiement staging."
          # Exemple avec Render : appel du deploy hook stocké en secret.
          # curl -fsS -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

  # ------------------------------------------------------------
  # Déploiement production (branche main)
  # ------------------------------------------------------------
  deploy-production:
    name: Déploiement production
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
      - name: Déployer en production
        run: |
          echo "Déclenchement du déploiement production."
          # curl -fsS -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"

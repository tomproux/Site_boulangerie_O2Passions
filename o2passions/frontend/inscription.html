<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — O2Passions</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.O2_API_BASE = 'http://localhost:5000/api';</script>
</head>
<body>

  <header class="entete">
    <div class="conteneur">
      <a href="index.html" class="logo">O2Passions</a>
      <nav class="nav-principale">
        <a href="index.html">Accueil</a>
        <a href="categorie.html">Nos produits</a>
        <a href="panier.html">Panier<span class="compteur-panier" data-compteur-panier style="display:none">0</span></a>
        <span data-zone-compte></span>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="conteneur">
      <div class="formulaire">
        <h1 class="texte-centre" style="font-size:1.6rem">Créer un compte</h1>
        <p id="message" class="message" style="display:none"></p>
        <form id="formulaire-inscription">
          <div class="champ">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
          </div>
          <div class="champ">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
          </div>
          <div class="champ">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="champ">
            <label for="phone">Téléphone (facultatif)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>
          <div class="champ">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <small class="texte-doux">8 caractères minimum.</small>
          </div>
          <div class="champ">
            <label for="passwordConfirm">Confirmer le mot de passe</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn" style="width:100%">Créer mon compte</button>
        </form>
        <p class="texte-centre" style="margin-top:20px;font-size:0.92rem">
          Déjà inscrit ? <a href="connexion.html">Se connecter</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="pied">
    <div class="conteneur">
      <div class="pied-bas">© 2026 O2Passions — Tous droits réservés.</div>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — O2Passions</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.O2_API_BASE = 'http://localhost:5000/api';</script>
</head>
<body>

  <header class="entete">
    <div class="conteneur">
      <a href="index.html" class="logo">O2Passions</a>
      <nav class="nav-principale">
        <a href="index.html">Accueil</a>
        <a href="categorie.html">Nos produits</a>
        <a href="panier.html">Panier<span class="compteur-panier" data-compteur-panier style="display:none">0</span></a>
        <span data-zone-compte></span>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="conteneur">
      <div class="formulaire">
        <h1 class="texte-centre" style="font-size:1.6rem">Connexion</h1>
        <p id="message" class="message" style="display:none"></p>
        <form id="formulaire-connexion">
          <div class="champ">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="champ">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn" style="width:100%">Se connecter</button>
        </form>
        <p class="texte-centre" style="margin-top:20px;font-size:0.92rem">
          Pas encore de compte ? <a href="inscription.html">Créer un compte</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="pied">
    <div class="conteneur">
      <div class="pied-bas">© 2026 O2Passions — Tous droits réservés.</div>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>

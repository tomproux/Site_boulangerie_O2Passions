<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace — O2Passions</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.O2_API_BASE = 'http://localhost:5000/api';</script>
</head>
<body>

  <header class="entete">
    <div class="conteneur">
      <a href="index.html" class="logo">O2Passions</a>
      <nav class="nav-principale">
        <a href="index.html">Accueil</a>
        <a href="categorie.html">Nos produits</a>
        <a href="panier.html">Panier<span class="compteur-panier" data-compteur-panier style="display:none">0</span></a>
        <span data-zone-compte></span>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="conteneur">
      <h1 class="mb-32">Mon espace</h1>
      <p id="message-commande" class="message" style="display:none"></p>

      <section class="encart mb-32" style="max-width:560px">
        <h2 style="font-size:1.2rem">Mes informations</h2>
        <p class="texte-doux" style="font-size:0.9rem">E-mail : <span id="email-profil"></span></p>
        <p id="message-profil" class="message" style="display:none"></p>
        <form id="formulaire-profil">
          <div class="champ">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="champ">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div class="champ">
            <label for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone">
          </div>
          <button type="submit" class="btn">Enregistrer</button>
        </form>
      </section>

      <section>
        <h2>Mes commandes</h2>
        <div id="liste-commandes"></div>
      </section>
    </div>
  </main>

  <footer class="pied">
    <div class="conteneur">
      <div class="pied-bas">© 2026 O2Passions — Tous droits réservés.</div>
    </div>
  </footer>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/account.js"></script>
</body>
</html>
